<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VKF · Transformation study</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101919;color:#edf3ed;font:16px system-ui,sans-serif}main{max-width:1020px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:clamp(23px,5vw,34px);margin:8px 0}small{color:#b6c7bd}select,button{font:inherit;padding:10px;border-radius:7px;border:1px solid #50645b;background:#22342a;color:inherit}label{display:block}canvas{display:block;width:100%;height:min(52vh,460px);min-height:200px;background:#172322;border:1px solid #35463c;border-radius:14px;margin:18px 0}.controls{display:flex;gap:14px;align-items:center}.controls label{flex:1}input[type=range]{display:block;width:100%;accent-color:#89e4b1}output{font-variant-numeric:tabular-nums}#note{min-height:3em;color:#bfcec5;line-height:1.5}footer{font-size:13px;color:#aebdb5;line-height:1.5}.legend{display:flex;gap:18px;font-size:14px;margin-bottom:12px}.mint{color:#89e4b1}.gold{color:#e4b967}@media(max-width:550px){main{padding:15px}header{display:block}select{width:100%;margin-top:8px}canvas{height:38vh}#note{font-size:14px}}
</style></head><body><main>
<header><div><small>VEKTOR FLOW · RESEARCH PROTOTYPE</small><h1>Transform, preserve, explore.</h1></div>
<label>Example<select id="example"><option value="rotation">Rotation</option><option value="translation">Translation</option><option value="affine">Affine · scale and shear</option><option value="branch">One → two · moving split</option><option value="material">Mass, area and colour</option><option value="annulus">O → D · preserve a hole</option><option value="split">3 → 7 · conserved weights</option></select></label></header>
<canvas id="view" role="img" aria-label="Transformation preview"></canvas>
<div class="legend"><span class="mint">● Affine first</span><span class="gold">◌ Point interpolation</span></div>
<div class="controls"><button id="play" type="button">Play</button><label for="time">Progress <output id="time-label">0.500</output><input id="time" type="range" min="0" max="1000" value="500"></label></div>
<p><label><input id="vectors" type="checkbox"> Show velocity vectors</label><small id="speed"></small></p>
<p id="note"></p><footer>Scrub in either direction. Independent shared-library experiment; no VKF compiler, physics or automatic topology solver is running. CPU Canvas preview.</footer>
</main><script type="module" src="./preview.mjs"></script></body></html>
